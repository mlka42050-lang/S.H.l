<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.H.L PRO | فروشگاه دیجیتال</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Vazirmatn",sans-serif;
    background:#07070c;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

button,input,select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

:root{
    --purple:#8b5cf6;
    --purple2:#6d28d9;
    --cyan:#22d3ee;
    --pink:#ec4899;
    --green:#22c55e;
    --red:#ef4444;
    --card:#11111a;
    --card2:#171722;
    --border:rgba(255,255,255,.09);
    --muted:#a1a1b3;
}

/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    top:-250px;
    right:-180px;
    background:rgba(139,92,246,.16);
    filter:blur(100px);
    border-radius:50%;
    pointer-events:none;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:450px;
    height:450px;
    bottom:-250px;
    left:-180px;
    background:rgba(34,211,238,.08);
    filter:blur(100px);
    border-radius:50%;
    pointer-events:none;
    z-index:-1;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(7,7,12,.82);
    backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
}

.nav{
    max-width:1250px;
    margin:auto;
    min-height:76px;
    padding:12px 20px;
    display:flex;
    align-items:center;
    gap:18px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:max-content;
}

.logo-box{
    width:45px;
    height:45px;
    border-radius:14px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,var(--purple),var(--cyan));
    color:#fff;
    font-weight:900;
    box-shadow:0 0 25px rgba(139,92,246,.35);
}

.logo-text{
    font-size:20px;
    font-weight:900;
    letter-spacing:1px;
}

.logo-text span{
    color:var(--cyan);
}

/* SEARCH */

.search{
    flex:1;
    position:relative;
}

.search input{
    width:100%;
    height:48px;
    border:1px solid var(--border);
    background:#101019;
    color:#fff;
    outline:none;
    border-radius:15px;
    padding:0 48px 0 18px;
    transition:.25s;
}

.search input:focus{
    border-color:rgba(139,92,246,.7);
    box-shadow:0 0 0 4px rgba(139,92,246,.08);
}

.search-icon{
    position:absolute;
    right:17px;
    top:50%;
    transform:translateY(-50%);
    opacity:.6;
}

.header-actions{
    display:flex;
    gap:9px;
}

.icon-btn{
    width:48px;
    height:48px;
    border:1px solid var(--border);
    border-radius:14px;
    background:#101019;
    color:#fff;
    position:relative;
    font-size:20px;
}

.icon-btn:hover{
    border-color:rgba(139,92,246,.6);
    transform:translateY(-2px);
}

.count{
    position:absolute;
    top:-5px;
    left:-5px;
    min-width:20px;
    height:20px;
    padding:0 5px;
    border-radius:50px;
    background:var(--pink);
    color:#fff;
    font-size:11px;
    display:grid;
    place-items:center;
    font-weight:800;
}

/* HERO */

.hero{
    max-width:1250px;
    margin:0 auto;
    padding:65px 20px 35px;
    display:grid;
    grid-template-columns:1.25fr
