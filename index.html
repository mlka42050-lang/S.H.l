<style>
*{
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:'Vazirmatn',Tahoma,Arial,sans-serif;
background:#080812;
color:#fff;
overflow-x:hidden;
}

h1,h2,h3,button,input{
font-family:'Vazirmatn',Tahoma,Arial,sans-serif;
}

body:before{
content:"";
position:fixed;
width:500px;
height:500px;
background:#6c2cff;
filter:blur(140px);
opacity:.25;
top:-150px;
right:-150px;
z-index:-1;
animation:move 8s infinite alternate;
}

body:after{
content:"";
position:fixed;
width:450px;
height:450px;
background:#00d9ff;
filter:blur(150px);
opacity:.18;
bottom:-150px;
left:-150px;
z-index:-1;
animation:move2 10s infinite alternate;
}

@keyframes move{
from{transform:translate(0,0)}
to{transform:translate(-100px,100px)}
}

@keyframes move2{
from{transform:translate(0,0)}
to{transform:translate(100px,-80px)}
}

header{
position:sticky;
top:0;
z-index:20;
background:rgba(8,8,18,.78);
backdrop-filter:blur(15px);
border-bottom:1px solid #ffffff15;
}

.nav{
max-width:1150px;
margin:auto;
padding:15px 20px;
display:flex;
align-items:center;
gap:18px;
}
