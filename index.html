<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070711">
<title>S.H.L | فروشگاه آنلاین</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"Vazirmatn",sans-serif;
  background:#070711;
  color:#fff;
  overflow-x:hidden;
}

button,input,select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

::-webkit-scrollbar{
  width:8px;
}

::-webkit-scrollbar-track{
  background:#090912;
}

::-webkit-scrollbar-thumb{
  background:linear-gradient(#8b5cf6,#06b6d4);
  border-radius:20px;
}

/* ---------- TOP BAR ---------- */

.topbar{
  height:4px;
  position:fixed;
  top:0;
  right:0;
  left:0;
  z-index:9999;
  background:linear-gradient(90deg,#8b5cf6,#06b6d4,#ec4899,#8b5cf6);
  background-size:300% 100%;
  animation:gradient 5s linear infinite;
}

@keyframes gradient{
  0%{background-position:0%}
  100%{background-position:300%}
}

/* ---------- HEADER ---------- */

header{
  position:fixed;
  top:4px;
  right:0;
  left:0;
  z-index:1000;
  background:rgba(7,7,17,.78);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.nav{
  max-width:1250px;
  margin:auto;
  min-height:78px;
  display:flex;
  align-items:center;
  gap:25px;
  padding:12px 20px;
}

.logo{
  min-width:115px;
  font-size:30px;
  font-weight:900;
  letter-spacing:3px;
  background:linear-gradient(135deg,#fff,#a78bfa,#22d3ee);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.logo span{
  font-size:12px;
  display:block;
  letter-spacing:4px;
  color:#777;
  -webkit-text-fill-color:#777;
  text-align:center;
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  height:47px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:15px;
  outline:none;
  background:rgba(255,255,255,.06);
  color:#fff;
  padding:0 48px 0 18px;
  transition:.3s;
}

.search input:focus{
  border-color:#8b5cf6;
  box-shadow:0 0 25px rgba(139,92,246,.15);
}

.search-icon{
  position:absolute;
  right:17px;
  top:12px;
  color:#aaa;
}

.nav-actions{
  display:flex;
  gap:10px;
}

.icon-btn{
  width:46px;
  height:46px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  background:rgba(255,255,255,.05);
  color:#fff;
  font-size:20px;
  position:relative;
  transition:.3s;
}

.icon-btn:hover{
  transform:translateY(-2px);
  border-color:#8b5cf6;
  background:rgba(139,92,246,.15);
}

.cart-count{
  position:absolute;
  top:-7px;
  left:-7px;
  min-width:21px;
  height:21px;
  border-radius:50%;
  background:#ec4899;
  color:#fff;
  font-size:11px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
}

/* ---------- HERO ---------- */

.hero{
  min-height:760px;
  padding:145px 20px 80px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
}

.hero-bg{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 15% 35%,rgba(139,92,246,.22),transparent 32%),
    radial-gradient(circle at 85% 25%,rgba(6,182,212,.18),transparent 30%),
    radial-gradient(circle at 65% 90%,rgba(236,72,153,.1),transparent 25%);
}

.grid-bg{
  position:absolute;
  inset:0;
  opacity:.16;
  background-image:
    linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:50px 50px;
  mask-image:linear-gradient(to bottom,black,transparent);
}

.hero-inner{
  max-width:1250px;
  width:100%;
  margin:auto;
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  align-items:center;
  gap:40px;
}

.hero-text h1{
  font-size:clamp(45px,7vw,88px);
  line-height:1;
  font-weight:900;
  margin-bottom:25px;
}

.hero-text h1 .gradient{
  background:linear-gradient(90deg,#a78bfa,#22d3ee,#f472b6);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero-text p{
  color:#aaa;
  max-width:650px;
  font-size:18px;
  line-height:2;
  margin-bottom:32px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:13px;
}

.btn{
  border:0;
  border-radius:15px;
  padding:14px 23px;
  font-size:15px;
  font-weight:700;
  transition:.3s;
}

.btn-primary{
  color:white;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  box-shadow:0 12px 35px rgba(124,58,237,.25);
}

.btn-primary:hover{
  transform:translateY(-3px);
  box-shadow:0 17px 40px rgba(124,58,237,.4);
}

.btn-secondary{
  color:white;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
}

.btn-secondary:hover{
  background:rgba(255,255,255,.1);
}

.hero-visual{
  position:relative;
  min-height:450px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.character{
  width:330px;
  height:420px;
  border-radius:45% 45% 30% 30%;
  position:relative;
  background:
    radial-gradient(circle at 50% 25%,#fff 0 3%,transparent 4%),
    linear-gradient(145deg,#17172a,#0c0c17);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:
    0 0 70px rgba(139,92,246,.25),
    inset 0 0 70px rgba(139,92,246,.07);
  transform:rotate(-4deg);
}

.character:before{
  content:"S.H.L";
  position:absolute;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%) rotate(4deg);
  font-size:48px;
  font-weight:900;
  color:#fff;
  text-shadow:
    0 0 10px #8b5cf6,
    0 0 30px #8b5cf
