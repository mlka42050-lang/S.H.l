<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>S.H.L | فروشگاه آینده</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#070711;
  color:white;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  background:#7c3cff;
  filter:blur(180px);
  opacity:.18;
  top:-150px;
  right:-100px;
  z-index:-1;
}

body:after{
  content:"";
  position:fixed;
  width:400px;
  height:400px;
  background:#00e5ff;
  filter:blur(180px);
  opacity:.12;
  bottom:-150px;
  left:-100px;
  z-index:-1;
}

header{
  width:100%;
  padding:18px 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,7,17,.75);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:3px;
}

.logo span{
  color:#9b5cff;
}

nav{
  display:flex;
  gap:28px;
}

nav a{
  color:#aaa;
  text-decoration:none;
  transition:.3s;
}

nav a:hover{
  color:white;
}

.header-buttons{
  display:flex;
  gap:10px;
}

.icon-btn{
  width:44px;
  height:44px;
  border-radius:14px;
  border:1px solid #29293c;
  background:#11111d;
  color:white;
  cursor:pointer;
  font-size:19px;
}

.hero{
  min-height:650px;
  padding:80px 7%;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  align-items:center;
  gap:40px;
}

.hero-text small{
  color:#9b5cff;
  font-weight:bold;
  font-size:15px;
}

.hero h1{
  font-size:clamp(45px,6vw,82px);
  line-height:1.05;
  margin:20px 0;
  font-weight:900;
}

.hero h1 span{
  background:linear-gradient(90deg,#a66cff,#00e5ff);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:#a7a7b8;
  max-width:550px;
  line-height:2;
  font-size:17px;
}

.buttons{
  margin-top:30px;
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.btn{
  padding:15px 25px;
  border-radius:15px;
  border:0;
  cursor:pointer;
  color:white;
  font-weight:bold;
  font-size:15px;
}

.btn-main{
  background:linear-gradient(135deg,#8b45ff,#5d25d9);
  box-shadow:0 10px 35px rgba(130,60,255,.3);
}

.btn-dark{
  background:#12121e;
  border:1px solid #29293c;
}

.character-box{
  height:500px;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

  width:390px;
  height:390px;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 35%,#34344c,#11111e 60%,#080810);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:
